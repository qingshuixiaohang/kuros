# RocketMQ broker 配置（切片 #11 · 仅测试用，供 InteractionRocketMQIntegrationTest 挂载）
#
# 与 docker/rocketmq/broker.conf 的唯一关键差异是 brokerIP1：
# - compose 版用 brokerIP1=rocketmq-broker（容器网络内别名，backend 容器同网可达）
# - 测试版用 brokerIP1=localhost：Testcontainers 把 broker 的 10911/10909 以「固定端口」绑定到宿主，
#   宿主 JVM 上的 Spring 应用经 namesrv 拿到 broker 地址 localhost:10911 后可直接回连。
#   （RocketMQ 客户端先连 namesrv 取路由，再按路由里的 brokerIP1:listenPort 连 broker——
#    若 brokerIP1 是容器内网 IP，宿主 JVM 不可达，这是 RocketMQ 容器化测试的经典坑。）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
brokerIP1=localhost
listenPort=10911
# broker 经共享 Network 的别名 namesrv 连注册中心
namesrvAddr=namesrv:9876
# 自动建 topic：测试无需预先用 mqadmin 创建 post-interaction-topic
autoCreateTopicEnable=true
defaultTopicQueueNums=4
