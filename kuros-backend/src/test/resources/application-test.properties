spring.datasource.url=jdbc:h2:mem:kuros;MODE=MySQL;DB_CLOSE_DELAY=0;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.storage.local-dir=target/test-storage
app.storage.public-base-url=http://localhost:8080
# 认证测试参数（dev-code 等）已随登录链路迁至 kuros-user（split-06），
# backend 测试的会话由直建 helper（StpUtil.createLoginSession）生成，不再需要验证码配置

# 测试环境禁用缓存：确保每个测试用例直接查 DB，行为可预测
spring.cache.type=none

# 测试环境关闭 Sentinel 限流：避免限流干扰测试请求
app.sentinel.enabled=false

# 测试环境禁用 Nacos：不注册、不拉取远端配置（Nacos 集成测试用
# @DynamicPropertySource 显式开启并指向 Testcontainers 起的真实实例）
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false

# 测试环境禁用互动异步落库（切片 #11）：主测试套件不依赖 RocketMQ broker。
# async.enabled=false → 写路径走同步降级（等价切片 #11 之前的同步写），现有互动断言仍成立；
# function.definition 置空 → Spring Cloud Stream 不创建消费绑定；StreamBridge 从不被调用 →
# 不创建生产绑定 → binder 全程不连 name-server（name-server 仅给 binder 工厂 bean 一个哑值避免装配报错）。
# 异步链路（发消息→顺序消费→DB 最终一致）由专门的 RocketMQ Testcontainers 集成测试覆盖（交 CI/用户跑）。
app.interaction.async.enabled=false
# 切片 #14 se-05：同理关闭 CDC 消费——PostCdcStreamConfig 的 @ConditionalOnProperty 不成立，postCdcConsumer bean 不装配；
# 叠加下面 function.definition 置空，两个消费绑定都不创建，binder 全程不连 name-server。CDC 端到端由 se-07 compose 冒烟覆盖。
app.search.cdc.enabled=false
spring.cloud.function.definition=
spring.cloud.stream.rocketmq.binder.name-server=localhost:9876
