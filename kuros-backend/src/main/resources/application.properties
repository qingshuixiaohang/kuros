spring.application.name=kuros-backend

# Nacos 注册中心 + 配置中心（切片 #8）
# Boot 4 已废弃 bootstrap 机制，配置中心必须用 spring.config.import 引入（Q4 决策）；
# optional: 前缀 = Nacos 不可用时跳过远端配置，应用仍以本地默认值启动（Q10 决策）；
# 远端 dataId 只放环境覆盖值，本地这里保留完整 fallback（分层迁移，Q3 决策）
spring.config.import=optional:nacos:kuros-backend.properties
spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.config.group=DEFAULT_GROUP
# SCA 2025.1.x 官方适配 Boot 4.0.x，本项目 Boot 4.1.1 被版本校验器拦截；
# 校验器只做版本号比对，实际兼容性由集成测试验证（注册 + 配置拉取），
# 若测试通过则证明 minor 跨度真实可用，此开关关闭校验仅为解除人为障碍
spring.cloud.compatibility-verifier.enabled=false

# OpenFeign（split-08）：backend → kuros-user 内部 API 的声明式调用。
# 超时 connect 1s / read 2s——内部 API 是同集群轻量查询，超时必须短：
# kuros-user 抖动时快速失败并走降级占位，而不是拖垮 backend 的请求线程池。
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000
# url 留空 → 经 Nacos 服务发现解析为 lb://kuros-user；
# 测试用 @DynamicPropertySource 注入 JDK HttpServer 桩地址直连（免起 Nacos，秒级）
app.feign.kuros-user.url=${KUROS_USER_INTERNAL_URL:}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kuros?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis：SaToken 会话存储 + 验证码 + 权限缓存的底层依赖
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# SaToken：替代 Spring Security，管理 Token 会话、路由拦截、注解鉴权
# token-name 保持与前端 Cookie 名一致，前端零改动
sa-token.token-name=KUROS_SESSION
# 会话有效期（秒），默认 30 天；替代旧配置 app.auth.session-expiration-days
sa-token.timeout=${APP_AUTH_SESSION_TIMEOUT_SECONDS:2592000}
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-style=uuid
sa-token.is-log=false
sa-token.is-read-cookie=true
sa-token.is-read-header=false
sa-token.cookie-httponly=true
sa-token.cookie-secure=${APP_AUTH_SESSION_COOKIE_SECURE:false}
sa-token.cookie-same-site=Lax

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
# 认证域业务参数（app.auth.*：dev-code / dev-code-exposed / code-expiration-seconds /
# session-cookie-secure）已随认证链路整体迁至 kuros-user（split-06），本服务无代码消费；
# 注意：sa-token.cookie-secure 仍引用环境变量 APP_AUTH_SESSION_COOKIE_SECURE（同名但语义更窄，仅为 Cookie Secure 属性）
app.storage.local-dir=${APP_STORAGE_LOCAL_DIR:${user.dir}/storage}
app.storage.public-base-url=${APP_STORAGE_PUBLIC_BASE_URL:http://localhost:8080}

# Caffeine 本地缓存：热读路径加速（帖子详情、用户资料）
# test profile 中设为 none 以保护现有测试不受缓存影响
spring.cache.type=caffeine

# Sentinel 限流：保护 API 免受恶意刷接口攻击
# 生产环境可通过 app.sentinel.posts-list-qps 等属性调整阈值
# （原 app.sentinel.auth-code-qps 随认证链路迁出，split-06）
app.sentinel.enabled=true
app.sentinel.posts-list-qps=100
app.sentinel.post-detail-qps=50
app.sentinel.default-qps=200

# 存储策略选择：local（默认）或 minio
# 为什么用 @ConditionalOnProperty 而不是 @Profile？
# 因为 Profile 是粗粒度的“环境”，@ConditionalOnProperty 是细粒度的“配置项”。
# dev 环境想用 MinIO 测试？改一行配置就行，不用改 Profile。
app.storage.type=${APP_STORAGE_TYPE:local}

# MinIO 配置（app.storage.type=minio 时生效）
app.storage.minio.endpoint=${APP_STORAGE_MINIO_ENDPOINT:http://localhost:9000}
app.storage.minio.access-key=${APP_STORAGE_MINIO_ACCESS_KEY:minioadmin}
app.storage.minio.secret-key=${APP_STORAGE_MINIO_SECRET_KEY:minioadmin}
app.storage.minio.bucket=${APP_STORAGE_MINIO_BUCKET:kuros-media}
# SpringDoc OpenAPI：交互式 API 文档
# 生产环境必须关闭（安全风险：暴露 API 结构）
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# 应用信息（展示在 /actuator/info）
info.app.name=kuros-backend
info.app.description=鸣潮玩家社区后端
info.app.version=1.0.0
