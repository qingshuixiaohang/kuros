spring.application.name=kuros-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/kuros?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
