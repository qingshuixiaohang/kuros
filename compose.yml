services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kuros}
      MYSQL_USER: ${MYSQL_USER:-kuros}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kuros_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kuros_dev_root_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - kuros_mysql_data:/var/lib/mysql
      # 建库脚本仅对全新 volume 生效（MySQL entrypoint 只在首次初始化时执行）；
      # 已有 volume 需手动执行：见 docs/learning 或 docker exec mysql < 脚本
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 必须用 TCP（127.0.0.1）而非 localhost/socket：MySQL 首次初始化时的临时服务器
      # （跑 init SQL，含 nacos 建表）禁用了 TCP，socket ping 会提前报告 healthy，
      # 导致 nacos 被过早拉起连不上库（CI 全新 volume 实测踩坑）
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kuros_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 对象存储：S3 兼容的开源对象存储，替代本地磁盘存储。
  # 为什么需要 MinIO？
  # 1. 分布式：多台后端实例共享同一个 MinIO，文件不需要在实例间同步
  # 2. 高可用：MinIO 支持纠删码，部分磁盘损坏也不丢数据
  # 3. 无限容量：本地磁盘受限于单机，MinIO 可以扩展到 PB 级别
  # 访问地址：
  # - API: http://localhost:9000（后端 SDK 连接用）
  # - Console: http://localhost:9001（浏览器管理界面，可登录查看所有文件）
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
    # command 中的 --console-address 指定管理界面端口
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kuros_minio_data:/data
    healthcheck:
      # mc 是 MinIO 自带的命令行工具，检查服务是否就绪
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nacos 注册中心 + 配置中心（切片 #8）：standalone 单机（Q2 决策），
  # 配置数据持久化到已有 MySQL（Q6 决策），复用 docker/mysql-init 下的建库脚本
  # 端口：8848=OpenAPI，9848=gRPC（客户端通信），控制台宿主映射为 8081（避开 backend 的 8080）
  nacos:
    image: nacos/nacos-server:v3.1.1
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: "3306"
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: nacos_dev_password
      # 镜像默认 JDBC 参数缺 allowPublicKeyRetrieval：nacos 用户用 MySQL 8 默认的
      # caching_sha2_password 认证，非 SSL 首连必须取服务器公钥，缺它则认证直接失败
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
      # v3 镜像强制要求鉴权三件套（不配拒绝启动），但鉴权开关默认关闭：
      # dev 环境保持关闭（全新实例无 admin 用户，客户端无需账号）；生产硬化留给后续切片
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: kuros
      # 关闭命名空间兼容模式：它为 2.x→3.x 平滑升降级服务（空 namespace 与 public
      # 双向同步），我们全新安装无历史数据，不需要。保留默认开启时，启动期的命名空间
      # 迁移预检会在 DataSource 就绪前抢跑（No DataSource set，重试仅 3 秒），
      # MySQL 冷启动（CI 全新 volume）时直接崩，见上游 issue #14613。
      # 环境变量经 Spring 宽松绑定映射到 nacos.config.namespace.compatible.mode
      NACOS_CONFIG_NAMESPACE_COMPATIBLE_MODE: "false"
    ports:
      - "${NACOS_API_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_CONSOLE_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # 实测：v3 主服务的 /nacos/actuator/health 404（未暴露），
      # prometheus 端点无需鉴权且 200，直接探主服务（8848）而非控制台
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/prometheus -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build:
      context: ./kuros-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kuros}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-kuros}
      DB_PASSWORD: ${MYSQL_PASSWORD:-kuros_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # split-06：验证码环境变量（APP_AUTH_DEV_CODE*）已随认证链路迁至 user 服务；
      # backend 只保留 cookie-secure（sa-token.cookie-secure 配置项仍引用它）
      APP_AUTH_SESSION_COOKIE_SECURE: ${APP_AUTH_SESSION_COOKIE_SECURE:-false}
      APP_STORAGE_LOCAL_DIR: ${APP_STORAGE_LOCAL_DIR:-/app/storage}
      APP_STORAGE_PUBLIC_BASE_URL: ${APP_STORAGE_PUBLIC_BASE_URL:-http://localhost:8080}
      # 存储策略：compose 环境默认 local（与开发环境一致）。切换 MinIO 只需改 .env 中 APP_STORAGE_TYPE=minio
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      # MinIO 配置（APP_STORAGE_TYPE=minio 时生效）：
      # endpoint 用 minio（compose 服务名），不是 localhost（那是宿主机访问用）
      APP_STORAGE_MINIO_ENDPOINT: ${APP_STORAGE_MINIO_ENDPOINT:-http://minio:9000}
      APP_STORAGE_MINIO_ACCESS_KEY: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      APP_STORAGE_MINIO_SECRET_KEY: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
      APP_STORAGE_MINIO_BUCKET: ${APP_STORAGE_MINIO_BUCKET:-kuros-media}
      # Nacos 连接（切片 #8）：backend 通过服务名 nacos 访问注册中心
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      # RocketMQ（切片 #11）：互动事件异步落库的 name-server（compose 网络内用服务名）。
      # MQ 不可用时写路径同步降级落库，故 broker 不是硬依赖（见下方 depends_on required:false）
      ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-rocketmq-namesrv:9876}
      APP_INTERACTION_ASYNC_ENABLED: ${APP_INTERACTION_ASYNC_ENABLED:-true}
    # 宿主映射挪至 8090（Q1/Q5 决策）：8080 正门让给 gateway，8090 保留调试直连通道；
    # 容器内仍是 8080，compose 内部服务间通信不受影响
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    volumes:
      - kuros_storage:${APP_STORAGE_LOCAL_DIR:-/app/storage}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # MinIO 不是硬依赖：默认 local 模式不需要 MinIO。
      # 只有 APP_STORAGE_TYPE=minio 时才需要等 MinIO 就绪。
      minio:
        condition: service_healthy
        required: false
      # Nacos 是硬依赖：注册失败等于服务不在微服务体系中（Q10 决策，fail-fast 由编排层承担）
      nacos:
        condition: service_healthy
      # RocketMQ 是软依赖（切片 #11）：broker 就绪时优先异步落库；未就绪/不可用时
      # 写路径同步降级（不丢互动），故用 required:false —— 编排层等待但不因它失败
      rocketmq-broker:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Spring Cloud Gateway 统一入口（切片 #9）：占宿主 8080 正门，前端零改动（Q1 决策）。
  # 纯换门（Q6 决策）：路由原样透传，不加限流/鉴权/CORS；split-06 起
  # /api/v1/auth/** → user（认证链路），split-07 起 /api/v1/users/*/follow → user
  # （关注链路），其余 → backend。
  # WebFlux 网关无法嵌入 Servlet 后端，必须独立容器，故为平级新工程 kuros-gateway/
  gateway:
    build:
      context: ./kuros-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      nacos:
        condition: service_healthy
      # backend 就绪后才对外放行：正门刚打开就该能出去
      backend:
        condition: service_healthy
      # split-06 起认证、split-07 起关注的路由都指向 user：等它就绪后再放行
      user:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # 用户服务（切片 #10 / split-05）：第一个从 backend 拆出的业务微服务，
  # 独立库 kuros_user（建库脚本见 docker/mysql-init/40-kuros-user-create-db.sh）。
  # 骨架阶段只交付"能启动、能注册、能迁移"三项能力；split-06 迁入认证链路，
  # split-07 迁入关注链路（用户域从此只在本服务读写）；宿主映射 8091 与
  # backend 的 8090 并列，是调试直连通道（容器内仍是 8080）
  user:
    build:
      context: ./kuros-user
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/kuros_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-kuros}
      DB_PASSWORD: ${MYSQL_PASSWORD:-kuros_dev_password}
      # 共享同一 Redis 实例：拆服务不拆会话（SaToken 会话跨服务可见的地基）
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-nacos:8848}
      # 认证链路环境变量（split-06 随 /api/v1/auth/** 从 backend 迁入）：
      # 登录响应会 Set-Cookie 且浏览器从宿主机 :3000 跨域调用，CORS 响应头由本服务给出
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # dev 环境默认固定验证码 123456（与旧版 DevVerificationCodeService 的默认值一致）：
      # compose-smoke.mjs 和前端演示登录都硬编码用它；生产环境走 .env.production.example，必须置空
      APP_AUTH_DEV_CODE: ${APP_AUTH_DEV_CODE:-123456}
      APP_AUTH_DEV_CODE_EXPOSED: ${APP_AUTH_DEV_CODE_EXPOSED:-false}
      APP_AUTH_SESSION_COOKIE_SECURE: ${APP_AUTH_SESSION_COOKIE_SECURE:-false}
    ports:
      - "${USER_PORT:-8091}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 与 backend 同款：注册失败等于服务不在微服务体系中（fail-fast 由编排层承担）
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # RocketMQ NameServer（切片 #11）：路由注册中心——broker 向其注册、producer/consumer 从其拉路由。
  # 无状态、轻量；9876 是 RocketMQ namesrv 默认端口。镜像版本与 client 严格对齐（rocketmq-client 5.3.1）
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    command: sh mqnamesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    healthcheck:
      # mqadmin clusterList 能连上 namesrv 即视为就绪（比纯 TCP 探活更贴近可用）
      test: ["CMD-SHELL", "sh mqadmin clusterList -n localhost:9876 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # RocketMQ Broker（切片 #11）：消息存储与投递。单 broker、无主从（ASYNC_MASTER），够演示。
  # broker.conf（docker/rocketmq/broker.conf）里 brokerIP1 显式设为服务名 rocketmq-broker：
  # broker 默认把"本机自动探测 IP"注册到 namesrv，容器内探测到的 IP 其他容器/宿主不可达，
  # 客户端拿到路由却连不上——设为 compose 服务名让网络内可解析。autoCreateTopicEnable=true 便于 dev。
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    restart: unless-stopped
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      # 收敛 broker JVM 堆，避免与 mysql/nacos/backend 抢内存导致 compose 整体 OOM
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    command: sh mqbroker -c /home/rocketmq/broker.conf
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/broker.conf:ro
      - kuros_rocketmq_broker_data:/home/rocketmq/store
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
    healthcheck:
      # 从 broker 侧向 namesrv 查集群，能列出本 broker（BROKER）即就绪
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 2>/dev/null | grep -q broker-a || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # RocketMQ Dashboard（切片 #11）：可视化 topic/消费组/死信，运维观测面。
  # 宿主 8082（避开 gateway 8080 / nacos 8081）；不参与业务链路，仅排障用
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8080"
    ports:
      - "${ROCKETMQ_DASHBOARD_PORT:-8082}:8080"
    depends_on:
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      # 前端浏览器侧访问的是 8080 正门（gateway），等 gateway 即可（它已等过 backend）
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kuros_mysql_data:
  kuros_storage:
  kuros_redis_data:
  kuros_minio_data:
  kuros_rocketmq_broker_data:
