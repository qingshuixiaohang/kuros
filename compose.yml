services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kuros}
      MYSQL_USER: ${MYSQL_USER:-kuros}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kuros_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kuros_dev_root_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - kuros_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - kuros_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO 对象存储：S3 兼容的开源对象存储，替代本地磁盘存储。
  # 为什么需要 MinIO？
  # 1. 分布式：多台后端实例共享同一个 MinIO，文件不需要在实例间同步
  # 2. 高可用：MinIO 支持纠删码，部分磁盘损坏也不丢数据
  # 3. 无限容量：本地磁盘受限于单机，MinIO 可以扩展到 PB 级别
  # 访问地址：
  # - API: http://localhost:9000（后端 SDK 连接用）
  # - Console: http://localhost:9001（浏览器管理界面，可登录查看所有文件）
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
    # command 中的 --console-address 指定管理界面端口
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kuros_minio_data:/data
    healthcheck:
      # mc 是 MinIO 自带的命令行工具，检查服务是否就绪
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./kuros-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-kuros}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-kuros}
      DB_PASSWORD: ${MYSQL_PASSWORD:-kuros_dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      # dev 环境默认固定验证码 123456（与旧版 DevVerificationCodeService 的默认值一致）：
      # compose-smoke.mjs 和前端演示登录都硬编码用它；生产环境走 .env.production.example，必须置空
      APP_AUTH_DEV_CODE: ${APP_AUTH_DEV_CODE:-123456}
      APP_AUTH_DEV_CODE_EXPOSED: ${APP_AUTH_DEV_CODE_EXPOSED:-false}
      APP_AUTH_SESSION_COOKIE_SECURE: ${APP_AUTH_SESSION_COOKIE_SECURE:-false}
      APP_STORAGE_LOCAL_DIR: ${APP_STORAGE_LOCAL_DIR:-/app/storage}
      APP_STORAGE_PUBLIC_BASE_URL: ${APP_STORAGE_PUBLIC_BASE_URL:-http://localhost:8080}
      # 存储策略：compose 环境默认 local（与开发环境一致）。切换 MinIO 只需改 .env 中 APP_STORAGE_TYPE=minio
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      # MinIO 配置（APP_STORAGE_TYPE=minio 时生效）：
      # endpoint 用 minio（compose 服务名），不是 localhost（那是宿主机访问用）
      APP_STORAGE_MINIO_ENDPOINT: ${APP_STORAGE_MINIO_ENDPOINT:-http://minio:9000}
      APP_STORAGE_MINIO_ACCESS_KEY: ${APP_STORAGE_MINIO_ACCESS_KEY:-minioadmin}
      APP_STORAGE_MINIO_SECRET_KEY: ${APP_STORAGE_MINIO_SECRET_KEY:-minioadmin}
      APP_STORAGE_MINIO_BUCKET: ${APP_STORAGE_MINIO_BUCKET:-kuros-media}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - kuros_storage:${APP_STORAGE_LOCAL_DIR:-/app/storage}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # MinIO 不是硬依赖：默认 local 模式不需要 MinIO。
      # 只有 APP_STORAGE_TYPE=minio 时才需要等 MinIO 就绪。
      minio:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./front
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kuros_mysql_data:
  kuros_storage:
  kuros_redis_data:
  kuros_minio_data:
