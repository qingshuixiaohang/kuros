spring.application.name=kuros-gateway

# 服务端口：裸跑与容器模式都是 8080（正门），显式声明以便 SERVER_PORT 可覆盖
server.port=${SERVER_PORT:8080}

# Nacos 注册中心 + 配置中心（与 backend 同款分层模式，切片 #8 惯例）
# Boot 4 已废弃 bootstrap 机制，配置中心必须用 spring.config.import 引入；
# optional: 前缀 = Nacos 不可用时跳过远端配置，网关仍以本地默认值启动（Q12 决策）
spring.config.import=optional:nacos:kuros-gateway.properties
spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.config.group=DEFAULT_GROUP
# 版本校验器只做字符串比对：实际兼容性（Boot 4.1.1 + SC 2025.1.1 + SCA 2025.1.0.0）
# 已由切片 #8 集成测试实测验证，与 backend 同款开关
spring.cloud.compatibility-verifier.enabled=false

# 路由（Q2/Q6 决策：原样透传，纯换门无改写过滤器；split-06 起两条）：
# /api/v1/auth/** → lb://kuros-user（认证链路，优先匹配），/** → lb://kuros-backend。
# 注意：不用 properties 索引写法（routes[0].predicates[0]=Path=/**），
# 该官方文档写法在 Boot 4.1 + SCG 4.3 组合下绑定失败（predicates 留空触发
# @NotEmpty 拒绝启动，CI 实测踩坑），路由改在 GatewayRoutesConfig 编程式声明；
# uri 可用 app.routes.backend-uri / app.routes.user-uri 覆盖（集成测试的桩服务器缝依赖它）
# SCG 4.3 起路由属性前缀带 server.webflux 命名空间，starter 也从
# spring-cloud-starter-gateway 改名为 -gateway-server-webflux

# Actuator 白名单（Q9 决策）：网关只暴露探测 + 指标，其余端点不暴露
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# --- CORS 预检由网关边缘应答（修复浏览器登录 Failed to fetch）---
# 实测坑：SCG(WebFlux) 不把 OPTIONS 预检转发给下游服务——RoutePredicateHandlerMapping
# 自己短路预检；未配 globalcors 时响应是"裸 200 无 Access-Control-Allow-* 头"，
# 浏览器据此拒绝后续真实请求（fetch 抛 Failed to fetch）。
# 证据：OPTIONS 直连 user:8091 带全 CORS 头，经 gateway:8080 全丢。
# 真实请求的 CORS 头仍由各服务 CorsConfig 给出；网关与服务都加会产生重复 ACAO
# （多值同样被浏览器拒绝），去重过滤器 DedupeResponseHeader 改在 GatewayRoutesConfig
# 编程式声明——default-filters[0] 索引写法在 Boot 4.1 + SCG 5.x 静默绑定失效
# （与 routes 索引同款坑，集成测试 expected:<1> but was:<2> 实证），故不再在此配置。
# 前缀注意：SCG 5.x 为 spring.cloud.gateway.server.webflux.*（已对
# spring-cloud-gateway-server-webflux-5.0.1.jar 的 spring-configuration-metadata 核实），旧前缀不绑定。
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/**].allowed-origins=${app.cors.allowed-origin:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/**].exposed-headers=X-XSRF-TOKEN
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/api/**].max-age=3600

# 应用信息（展示在 /actuator/info，info 端点未在白名单中，仅留档）
info.app.name=kuros-gateway
info.app.description=鸣潮玩家社区 API 网关
info.app.version=1.0.0
