spring.application.name=kuros-gateway

# Nacos 注册中心 + 配置中心（与 backend 同款分层模式，切片 #8 惯例）
# Boot 4 已废弃 bootstrap 机制，配置中心必须用 spring.config.import 引入；
# optional: 前缀 = Nacos 不可用时跳过远端配置，网关仍以本地默认值启动（Q12 决策）
spring.config.import=optional:nacos:kuros-gateway.properties
spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.config.group=DEFAULT_GROUP
# 版本校验器只做字符串比对：实际兼容性（Boot 4.1.1 + SC 2025.1.1 + SCA 2025.1.0.0）
# 已由切片 #8 集成测试实测验证，与 backend 同款开关
spring.cloud.compatibility-verifier.enabled=false

# 路由（Q2/Q6 决策：原样透传，纯换门无改写过滤器；split-06 起两条）：
# /api/v1/auth/** → lb://kuros-user（认证链路，优先匹配），/** → lb://kuros-backend。
# 注意：不用 properties 索引写法（routes[0].predicates[0]=Path=/**），
# 该官方文档写法在 Boot 4.1 + SCG 4.3 组合下绑定失败（predicates 留空触发
# @NotEmpty 拒绝启动，CI 实测踩坑），路由改在 GatewayRoutesConfig 编程式声明；
# uri 可用 app.routes.backend-uri / app.routes.user-uri 覆盖（集成测试的桩服务器缝依赖它）
# SCG 4.3 起路由属性前缀带 server.webflux 命名空间，starter 也从
# spring-cloud-starter-gateway 改名为 -gateway-server-webflux

# Actuator 白名单（Q9 决策）：网关只暴露探测 + 指标，其余端点不暴露
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# 应用信息（展示在 /actuator/info，info 端点未在白名单中，仅留档）
info.app.name=kuros-gateway
info.app.description=鸣潮玩家社区 API 网关
info.app.version=1.0.0
