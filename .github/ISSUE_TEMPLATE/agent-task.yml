name: Agent 任务单（dsh-superagent）
description: 准备可独立验收的任务；确认准备完成后再派发
title: "[agent] "
body:
  - type: markdown
    attributes:
      value: |
        讨论中的任务保留为草稿，不填写派发账号。派发前确认范围、验收、依赖和环境；标签不触发执行。
        仓库规范见 docs/agents/issue-tracker.md，无需在正文重复通用命令。
  - type: input
    id: dispatch
    attributes:
      label: 派发
      description: 准备完成后填写机器人账号；留空仅记录需求。这个字段会进入正文。
      placeholder: "@qingshuixiaohan-dotcom"
  - type: textarea
    id: goal
    attributes:
      label: 目标与现状
      description: 写用户可观察到的结果，并附当前路径、报错、截图或复现步骤。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与取舍
      description: 写允许改变的行为和必须保留的约束；文件路径可作线索，不要求预先猜出全部实现文件。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 写操作或请求、预期结果和失败场景；验证命令按仓库分级要求选择。
      placeholder: |
        - [ ] 输入……并执行……，观察到……
        - [ ] 失败时……，原有行为……保持
    validations:
      required: true
  - type: textarea
    id: prerequisites
    attributes:
      label: 依赖与运行前提
      description: 列出必须先合并的 Issue/PR，及容器、服务或测试数据需要；没有则填无。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关实现与规格
      description: 可选；提供已知候选及链接，未调查时写未调查，不以“无”假装已搜索。
  - type: textarea
    id: evidence
    attributes:
      label: 效果验收方式
      description: 界面写进入路径与操作步骤；API 写请求与响应；文档可直接看 diff。
    validations:
      required: true
