name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuros-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 全量测试（切片 #10 起）：早期 -Dtest=KurosBackendApplicationTests 过滤器在新增
      # 测试类后从未同步，新增类静默不跑；跨类污染已在 cbae01c 修复（唯一 H2 库名 +
      # 每类独立 JVM），全量运行因此确定性可依赖
      - name: Run tests
        run: chmod +x mvnw && ./mvnw test

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuros-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 全量测试：含两个 Testcontainers 集成测试（桩透传 + Nacos 注册/lb 发现），
      # ubuntu runner 自带 Docker，无需额外配置
      - name: Run tests
        run: chmod +x mvnw && ./mvnw test

  user:
    name: User service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kuros-user
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # 全量测试：含 Testcontainers 集成测试（Nacos 注册 + health/prometheus + 迁移种子），
      # ubuntu runner 自带 Docker，无需额外配置
      - name: Run tests
        run: chmod +x mvnw && ./mvnw test

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build and start the Compose stack
        run: APP_AUTH_DEV_CODE=123456 APP_AUTH_DEV_CODE_EXPOSED=true docker compose up -d --build
      - name: Verify service health
        run: |
          # 切片 #9 起 8080 正门归 gateway，8090 是 backend 调试直连口：
          # 8080 探的是网关自身 health，backend 就绪门控改用 8090；
          # 切片 #10 split-05 起 8091 是 user 服务的调试直连口
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://localhost:8090/actuator/health
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://localhost:8091/actuator/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/actuator/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/guides
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/guides/10000000-0000-0000-0000-000000000001
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/profile
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/publish
      - name: Install Node.js for Compose smoke test
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify business data and file persistence
        run: node scripts/compose-smoke.mjs
      - name: Restart application services and verify again
        run: |
          docker compose restart mysql
          sleep 10
          docker compose restart backend user frontend
          sleep 5
          # 8080 已是 gateway 正门（探到的是网关自身 health，恒绿），
          # 不能再作为 backend 就绪门控；先用 8090/8091 直连门控 backend 与 user，
          # 再探网关与前端，最后 smoke（业务请求经网关转发）
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://localhost:8090/actuator/health
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 http://localhost:8091/actuator/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:8080/actuator/health
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 http://localhost:3000/
          node scripts/compose-smoke.mjs
      - name: Collect service logs for diagnostics
        if: always()
        # 两个业务服务一并收集，便于对照排查（拆分后的排障常态）
        run: docker compose logs --no-color backend user mysql
      - name: Stop the Compose stack
        if: always()
        run: |
          docker compose down -v
          rm -f .compose-smoke-state.json
