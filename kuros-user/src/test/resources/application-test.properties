# 测试环境用 H2（MySQL 兼容模式）替代 kuros_user 独立库。
# 库名带工程后缀：切片 #10 的跨类污染结论——同名库 + context 缓存会让迁移与数据串类，
# 唯一命名是防御的第一层（第二层是 pom 里 surefire reuseForks=false）
spring.datasource.url=jdbc:h2:mem:kuros_user_test;MODE=MySQL;DB_CLOSE_DELAY=0;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 测试仍走真实 Flyway：V1/V2 迁移的可执行性在测试里同样被验证
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 认证域测试参数（split-06 随认证代码迁入）：固定验证码 + 回显，
# 测试直接用 123456 走完整登录（与 backend 测试及 compose 冒烟脚本同一约定）。
# sec-01 A1 漏洞修复后主配置默认值改为空，这里是 test profile 的**显式注入**：
# 万能码只在明确声明可信的环境里出现，默认形态（忘配 env）不再自带钥匙
app.auth.dev-code=123456
app.auth.dev-code-exposed=true
# sec-01 A2 漏洞修复：/internal/** 要求 X-Internal-Token 共享密钥。
# 集成测试（InternalTokenIntegrationTest 等）经 @DynamicPropertySource 覆盖此值；
# 这里给一个兜底默认值，避免"忘了注入"表现为零配置（fail-closed 全部 401）
app.internal.token=test-internal-token

# 测试环境禁用 Nacos：不注册、不拉取远端配置（Nacos 集成测试用
# @DynamicPropertySource 显式开启并指向 Testcontainers 起的真实实例）
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
