spring.application.name=kuros-user

# 服务端口：裸跑默认 8091；容器模式由 compose 注入 SERVER_PORT=8080 覆盖
server.port=${SERVER_PORT:8091}

# Nacos 注册中心 + 配置中心（与 backend/gateway 同款分层模式）
# Boot 4 已废弃 bootstrap 机制，配置中心必须用 spring.config.import 引入；
# optional: 前缀 = Nacos 不可用时跳过远端配置，服务仍以本地默认值启动
spring.config.import=optional:nacos:kuros-user.properties
spring.cloud.nacos.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.config.group=DEFAULT_GROUP
# 版本校验器只做字符串比对，实际兼容性由集成测试验证（同 backend/gateway，三工程共用同一赌注结论）
spring.cloud.compatibility-verifier.enabled=false

# 独立库 kuros_user：服务拆分的第一硬边界——跨库 JOIN 在物理上不可能，
# 用户域数据的一切跨服务访问必须走 API（split-08 起 OpenFeign），这是拆分的代价，也是目的
# 本地 IDEA 直连的默认值三件套（dev-only，与 .env / compose.yml 同一套凭据，仓库先例：compose 已内置）：
# - 端口 3307：compose 把容器 MySQL 映射到宿主 3307（避开机器上可能存在的原生 3306），
#   默认值若写 3306，IDEA 启动会连到别的 MySQL 实例上，报 Access denied 而不是连不上，极具迷惑性
# - allowPublicKeyRetrieval=true：root 用 MySQL 8 默认的 caching_sha2_password 认证，
#   非 SSL 首次握手需要向服务端索取公钥，缺此参数会报 "Public Key Retrieval is not allowed"
# - 密码默认值 = .env 的 MYSQL_ROOT_PASSWORD：容器侧 compose 注入 DB_PASSWORD（OS env 优先级更高）覆盖此默认值，
#   本地侧无 env 时回落到 dev 凭据——一份文件同时服务两种运行方式
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/kuros_user?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:kuros_dev_root_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis：与 kuros-backend 共享同一实例——SaToken 会话在拆分后仍全程可见，
# 这是"拆服务不拆会话"的地基（split-06 端到端验证）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# SaToken：认证与会话（split-06 自 kuros-backend 逐字复制关键项）
# 为什么必须逐字一致：会话存共享 Redis，token-name/timeout/Cookie 属性任何一项漂移，
# 都会让"经网关登录 → backend 读取同一会话"失效（拆服务不拆会话的配置面契约）
sa-token.token-name=KUROS_SESSION
# 会话有效期（秒），默认 30 天；环境变量名与 backend 相同，compose 统一注入
sa-token.timeout=${APP_AUTH_SESSION_TIMEOUT_SECONDS:2592000}
sa-token.active-timeout=-1
sa-token.is-concurrent=true
sa-token.is-share=false
sa-token.token-style=uuid
sa-token.is-log=false
sa-token.is-read-cookie=true
sa-token.is-read-header=false
sa-token.cookie-httponly=true
sa-token.cookie-secure=${APP_AUTH_SESSION_COOKIE_SECURE:false}
sa-token.cookie-same-site=Lax

# 认证域业务参数（split-06 随认证代码迁入）+ CORS 放行源（浏览器经网关访问本服务的跨域应答）
# 注：backend 的 app.auth.session-cookie-secure 未随迁——SaToken 的 cookie-secure
# 直接读上面那行 APP_AUTH_SESSION_COOKIE_SECURE，旧 app.auth.* 键已无消费者
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}
# dev 固定验证码：默认**空**，即"没有万能码"。
# 曾经的默认值是 123456，任何忘配 env 的部署（裸跑 jar、IDEA 直跑、新人 clone）
# 都得到同一个可预测的登录码，等于任意手机号可登录——安全漏洞，不是便利。
# 便利性改由 env/compose 显式注入（compose.yml 的 user 服务已注入
# APP_AUTH_DEV_CODE，那是开发环境的主动选择），配置默认值必须是"最安全"的那个。
# 配套的启动期 fail-fast 见 DevCodeSafetyValidator：显式注入了 dev-code 但
# profile 又不是 dev/test，直接拒绝启动（防止误配残留混进非可信环境）。
app.auth.dev-code=${APP_AUTH_DEV_CODE:}
# 回显开关默认 false：响应体直接回显验证码等于把登录码印在登录接口上，
# 只有 dev 环境（compose/.env 显式注入 true）才允许。与 dev-code 同款分层。
app.auth.dev-code-exposed=${APP_AUTH_DEV_CODE_EXPOSED:false}
app.auth.code-expiration-seconds=${APP_AUTH_CODE_EXPIRATION_SECONDS:300}

# /internal/** 共享密钥（sec-01 A2 漏洞修复）：内部 API 面向服务间调用，
# 不带用户会话也无 CSRF token，请求头 X-Internal-Token 的值必须等于此配置。
# 默认空 = 未配置 = 全部拒绝（fail-closed）：宁可内部链路断，也不让内部 API
# 在零鉴权状态下暴露全站用户导出。kuros-backend 经同名 env 注入同一值。
app.internal.token=${APP_INTERNAL_TOKEN:}

# Actuator：只暴露探测 + 指标（compose healthcheck 与 Prometheus 采集用）
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# 应用信息（info 端点未在白名单，仅留档）
info.app.name=kuros-user
info.app.description=鸣潮玩家社区用户服务
info.app.version=1.0.0