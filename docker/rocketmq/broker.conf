brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：客户端经 namesrv 拿到的是 broker 用 brokerIP1 注册的地址。
# broker 默认自动探测本机 IP，容器内探测到的地址跨容器/宿主不可达——
# 客户端拿到路由却连不上。显式设为 compose 服务名，让同一 compose 网络内的
# backend / dashboard 都能解析到 broker。
brokerIP1 = rocketmq-broker
namesrvAddr = rocketmq-namesrv:9876

# dev 环境自动创建 topic（生产应关闭 autoCreateTopicEnable 并预建 topic + ACL）
autoCreateTopicEnable = true

# 顺序消息按 postId hash 选队列，依赖 topic 的多队列；默认 4 个读写队列足够演示分区
defaultTopicQueueNums = 4
